<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Бурмалда</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: red; }
    @media (max-width: 768px) { html, body { background: blue; } }
    .word {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 10vw;
      font-weight: bold;
      font-family: Arial, sans-serif;
      text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="word">БУРМАЛДА</div>
</body>
</html>
